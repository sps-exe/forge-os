# Render Blueprint for Forge OS Full-Stack Deployment
services:
  # NestJS Backend API Service
  - type: web
    name: forge-api
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3101
      - key: API_PORT
        value: 3101
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: forge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: forge-redis
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true

databases:
  # Managed PostgreSQL Database
  - name: forge-db
    databaseName: forge
    user: forge
    plan: free
    region: oregon

  # Managed Redis Cache
  - type: redis
    name: forge-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
