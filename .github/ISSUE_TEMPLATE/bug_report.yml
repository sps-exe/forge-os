name: 🐛 Bug Report
description: Create a report to help us fix a bug in Forge OS
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below with as much context as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Expected X to happen, but received Y...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '/tasks'
        2. Click on 'Complete'
        3. See error in console
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS, Browser, Node version, or Platform integration affected.
      placeholder: macOS 14.5, Chrome 126, Node 20.14.0
    validations:
      required: false
